worker_processes 4;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Activer l'utilisation de sendfile pour améliorer les performances
    sendfile on;

    # Garder les connexions ouvertes pendant 65 secondes
    keepalive_timeout 65;

    # Configuration du cache pour les proxys
    proxy_cache_path C:/nginx/cache levels=1:2 keys_zone=flask_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        # Redirection HTTP vers HTTPS
        listen 80;
        server_name inaya.clinique;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name inaya.clinique;

        # Certificats SSL
        ssl_certificate C:/inaya.clinique/certificat/certificate.crt;
        ssl_certificate_key C:/inaya.clinique/certificat/private.key;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        client_max_body_size 50M;

        # 🔹 Security Headers
        add_header X-Frame-Options SAMEORIGIN always;  # Prevent Clickjacking
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;  # HSTS
        add_header X-Content-Type-Options nosniff always;  # Prevent MIME-sniffing
        add_header Referrer-Policy no-referrer-when-downgrade always;  # Control Referrer Header
        add_header Permissions-Policy "geolocation=(), microphone=()" always;  # Block Geo & Mic access

        location / {
            proxy_pass http://192.168.10.9:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Configuration du cache pour cette location
            proxy_cache flask_cache;
            proxy_cache_valid 200 302 10m;  # Cacher les réponses 200 et 302 pendant 10 minutes
            proxy_cache_valid 404 1m;       # Cacher les réponses 404 pendant 1 minute
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;  # Ajouter le statut du cache dans les en-têtes HTTP
        }

        # Gestion des fichiers statiques
        location /static/ {
            alias C:/inaya.clinique/app/static/;
            expires 1w;  # Cacher les fichiers statiques pendant 1 semaine
            access_log off;  # Désactiver les logs pour les fichiers statiques
        }

        # Activer la compression gzip pour améliorer les temps de chargement
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 256;
        gzip_comp_level 5;  # Niveau de compression (1-9, 5 est un bon compromis)
        gzip_vary on;       

        # 🔹 Restrict HTTP Methods
        if ($request_method !~ ^(GET|POST|HEAD)$ ) {
            return 405;
        }
    }
}
