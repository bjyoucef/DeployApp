            <div class="modal fade" id="retournerModal{{ emprunt.id }}" tabindex="-1" role="dialog"
                 aria-labelledby="retournerModalLabel{{ emprunt.id }}" aria-hidden="true">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="retournerModalLabel{{ emprunt.id }}">Marquer la clé {{
                                emprunt.numero_cle }} retournée</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                        </div>
                        <div class="modal-body">
                            <form action="{{ url_for('retourner_key', id=emprunt.id) }}" method="POST">
                                <div class="form-group">
                                    <label for="id_personnel_retourner{{ emprunt.id }}">Personne retournant la
                                        clé</label>
                                    <select id="id_personnel_retourner{{ emprunt.id }}" name="personne_id_retourne"
                                            class="form-control" required>
                                        <option value="" disabled selected>-- Sélectionnez une personne --</option>
                                        {% for personne in personnes %}
                                        <option value="{{ personne.id_personnel }}">{{ personne.nom }} {{
                                            personne.prenom }}
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-success">Enregistrer</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
